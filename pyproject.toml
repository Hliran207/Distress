[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-core"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
ml = [
    "scikit-learn==1.6.1",
    "numpy==2.1.3",
    "joblib",
    "torch==2.6.0",
    "transformers",
    "huggingface_hub",
    "nltk==3.9.1",
]
mongo = ["pymongo>=4.6"]
kafka = ["confluent-kafka>=2.4"]
api = ["fastapi>=0.110", "uvicorn[standard]"]
bot = ["requests>=2.31"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]